<svg xmlns='http://www.w3.org/2000/svg' width='1024' height='1024' viewBox='0 0 1024 1024'>
  <rect width='100%' height='100%' fill='#FFF8E6'/>
  <!-- simple cartoon cat + litter box -->
  <g transform='translate(160,140)'>
    <!-- cat body -->
    <ellipse cx='320' cy='420' rx='220' ry='200' fill='#FFD9B5' stroke='#FFB380' stroke-width='6'/>
    <!-- head -->
    <circle cx='320' cy='210' r='110' fill='#FFD9B5' stroke='#FFB380' stroke-width='6'/>
    <!-- ears -->
    <polygon points='240,150 275,80 310,150' fill='#FFD9B5' stroke='#FFB380' stroke-width='5'/>
    <polygon points='400,150 365,80 330,150' fill='#FFD9B5' stroke='#FFB380' stroke-width='5'/>
    <!-- eyes -->
    <ellipse cx='290' cy='200' rx='18' ry='24' fill='#3B3B3B'/>
    <ellipse cx='350' cy='200' rx='18' ry='24' fill='#3B3B3B'/>
    <circle cx='295' cy='195' r='6' fill='#ffffff' opacity='0.9'/>
    <circle cx='355' cy='195' r='6' fill='#ffffff' opacity='0.9'/>
    <!-- nose & mouth -->
    <circle cx='322' cy='230' r='8' fill='#FF9F56'/>
    <path d='M310 244 Q322 256 334 244' stroke='#FF9F56' stroke-width='4' fill='none' stroke-linecap='round'/>
    <!-- whiskers -->
    <path d='M240 235 L290 240' stroke='#DCA17A' stroke-width='4' stroke-linecap='round'/>
    <path d='M400 235 L350 240' stroke='#DCA17A' stroke-width='4' stroke-linecap='round'/>
    <!-- tail -->
    <path d='M520 420 Q620 380 660 480' stroke='#FFD9B5' stroke-width='24' fill='none' stroke-linecap='round' stroke-linejoin='round'/>

    <!-- litter box -->
    <rect x='40' y='560' width='560' height='160' rx='18' fill='#fff' stroke='#E6F2EA' stroke-width='6'/>
    <rect x='72' y='596' width='496' height='80' rx='12' fill='#F7FBF9' stroke='#E6F2EA'/>
    <!-- scent lines -->
    <path d='M420 540 C440 520 460 520 480 540' stroke='#CDEDD7' stroke-width='6' fill='none' stroke-linecap='round' opacity='0.9'/>
    <text x='80' y='640' font-family='Noto Sans, Roboto, Arial' font-size='26' fill='#6b7280'>智能清理 · 抑菌除臭</text>
  </g>
</svg>