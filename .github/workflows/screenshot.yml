name: Generate Site Screenshot

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm init -y
          npm i puppeteer@20 --no-audit --no-fund

      - name: Run screenshot script
        run: |
          node .github/scripts/capture.js

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshot
          path: .github/artifacts/screenshot.png
